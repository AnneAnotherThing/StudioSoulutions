# Studio Soulutions, Netlify config
# Studio Soulutions platform build

[build]
  publish = "."
  functions = "netlify/functions"
  # No build step yet, static site. When we add a bundler, set command + a /dist publish dir.

# Pretty URLs for the three entry points
[[redirects]]
  from = "/kiosk"
  to   = "/kiosk.html"
  status = 200

[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

[[redirects]]
  from = "/app"
  to   = "/app.html"
  status = 200

[[redirects]]
  from = "/community"
  to   = "/community.html"
  status = 200

# SPA-style fallback for the phone view (handles deep links into tenant profiles later)
[[redirects]]
  from = "/app/*"
  to   = "/app.html"
  status = 200

# Everything else falls through to the marketing site (index.html)

# Short, revalidate-friendly cache on CSS/JS so edits propagate without manual busting
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Long immutable cache only on images/photos (filenames are versioned, e.g. logo_ss_green_v5.png)
[[headers]]
  for = "/assets/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Kiosk hardening, keep this tab from being framed elsewhere
[[headers]]
  for = "/kiosk.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
