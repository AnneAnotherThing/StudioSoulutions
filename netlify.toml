# Studio Soulutions — Netlify config
# Hive-Rise · Salon Plus Studio Suites build

[build]
  publish = "."
  # No build step yet — static site. When we add a bundler, set command + a /dist publish dir.

# Pretty URLs for the three entry points
[[redirects]]
  from = "/kiosk"
  to   = "/kiosk.html"
  status = 200

[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

# SPA-style fallback for the phone view (handles deep links into tenant profiles later)
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Long cache on hashed assets, short on HTML
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Kiosk hardening — keep this tab from being framed elsewhere
[[headers]]
  for = "/kiosk.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
